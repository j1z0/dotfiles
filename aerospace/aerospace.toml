# ~/.aerospace.toml  ->  ~/.dotfiles/aerospace/aerospace.toml
#
# i3-style tiling for macOS, no SIP disabling required. Karabiner maps Caps Lock
# to ctrl+alt, so every binding below reads as "Caps Lock + <key>" in practice.
#
# The point for agentic work: one workspace per concurrent agent. You park a
# Claude Code session in a worktree on workspace 3, glance at it with Caps+3,
# and it keeps its pane layout while you work elsewhere.

after-login-command = []
after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # wide screen splits vertically

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# ------------------------------------------------------------ main bindings --
[mode.main.binding]

# focus — vim keys
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

# move the focused window
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# resize
ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'
ctrl-alt-shift-0 = 'balance-sizes'

# layout
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'
ctrl-alt-f = 'fullscreen'
ctrl-alt-shift-f = 'layout floating tiling'
ctrl-alt-shift-semicolon = 'mode service'

# launch
ctrl-alt-enter = '''exec-and-forget osascript -e 'tell application "Ghostty" to activate' -e 'tell application "System Events" to keystroke "n" using command down' '''
ctrl-alt-shift-enter = 'exec-and-forget open -na Ghostty'

# numbered workspaces
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'

# named workspaces — mnemonics, the way Omarchy does it
ctrl-alt-b = 'workspace B'   # Browser
ctrl-alt-s = 'workspace S'   # Slack
ctrl-alt-m = 'workspace M'   # Mail / messages
ctrl-alt-p = 'workspace P'   # PyCharm
ctrl-alt-a = 'workspace A'   # Agents — long-running Claude Code sessions

# send the focused window to a workspace
ctrl-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
ctrl-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
ctrl-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
ctrl-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
ctrl-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
ctrl-alt-shift-b = 'move-node-to-workspace B --focus-follows-window'
ctrl-alt-shift-s = 'move-node-to-workspace S --focus-follows-window'
ctrl-alt-shift-a = 'move-node-to-workspace A --focus-follows-window'
ctrl-alt-shift-p = 'move-node-to-workspace P --focus-follows-window'

# navigation
ctrl-alt-tab = 'workspace-back-and-forth'
ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
ctrl-alt-shift-w = 'close'
ctrl-alt-shift-q = 'close-all-windows-but-current'

# flip the whole machine between solarized light and dark
ctrl-alt-t = 'exec-and-forget /Users/jeremy/.dotfiles/bin/theme toggle'

# ----------------------------------------------------------- service mode ----
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
ctrl-alt-h = ['join-with left', 'mode main']
ctrl-alt-j = ['join-with down', 'mode main']
ctrl-alt-k = ['join-with up', 'mode main']
ctrl-alt-l = ['join-with right', 'mode main']

# ------------------------------------------------------ app placement --------
# Apps land where you expect them without being dragged there every morning.
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.jetbrains.pycharm'
run = 'move-node-to-workspace P'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace A'

# things that are the wrong shape for tiling
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'
