# ~/.aerospace.toml  ->  ~/.dotfiles/aerospace/aerospace.toml
#
# i3-style tiling for macOS. The modifier is plain Option, so the only
# permission this needs is Accessibility — no keystroke access, no drivers.
#
# Option is an unusual modifier choice on a Mac and the tradeoff is real:
# AeroSpace grabs these chords globally, so the Option-glyphs on the bound
# letters (option-l is not, option-s is sharp-s, and so on) stop being typeable,
# and Option+hjkl / Option+digits no longer reach the terminal. Only the letters
# bound below are affected; option-e and friends still compose accents.
#
# The point for agentic work: one workspace per concurrent agent. You park a
# Claude Code session in a worktree on workspace 3, glance at it with Caps+3,
# and it keeps its pane layout while you work elsewhere.

# config-version 2 stopped inferring workspaces from bindings, so the ones you
# want to exist even while empty have to be named.
config-version = 2
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "B", "S", "M", "P", "A", "G", "U", "W"]

after-login-command = []
after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # wide screen splits vertically

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# ------------------------------------------------------------ main bindings --
[mode.main.binding]

# focus — vim keys
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# move the focused window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-0 = 'balance-sizes'

# layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'     # float THIS window -> drag-resize works
alt-shift-e = 'enable toggle'              # panic button: tiling off, macOS behaves normally again
alt-shift-semicolon = 'mode service'

# launch — bin/term names the profile explicitly, so a window opened by this
# key is correct even if iTerm2's default profile was never changed.
alt-enter = 'exec-and-forget /Users/jeremy/.dotfiles/bin/term'

# numbered workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# named workspaces — mnemonics, the way Omarchy does it
# These launch-or-focus rather than just switching workspace: a bare
# `workspace M` when Gmail isn't open just shows you an empty screen, which
# looks like the key did nothing. `goto` focuses the window if it exists and
# launches the app if it doesn't.
alt-b = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto browser'
alt-s = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto slack'
alt-m = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto mail'      # Gmail + Calendar, two tabs
alt-c = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto calendar'  # same window, calendar tab selected
alt-p = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto pycharm'
alt-a = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto claude'
alt-d = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto diagrams'  # Blitzy architecture diagrams page
alt-shift-d = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto drill'   # the morning keybinding drill
alt-g = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto chatgpt'   # G = chatGpt
alt-u = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto spotify'   # U = tUnes; S and M are taken
alt-w = 'exec-and-forget /Users/jeremy/.dotfiles/bin/goto day'       # W = Work: the blitzy-day dashboard (A alone, W docked)

# send the focused window to a workspace
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
alt-shift-b = 'move-node-to-workspace B --focus-follows-window'
alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
alt-shift-s = 'move-node-to-workspace S --focus-follows-window'
alt-shift-a = 'move-node-to-workspace A --focus-follows-window'
alt-shift-p = 'move-node-to-workspace P --focus-follows-window'
alt-shift-g = 'move-node-to-workspace G --focus-follows-window'
alt-shift-u = 'move-node-to-workspace U --focus-follows-window'

# navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-w = 'close'
alt-shift-q = 'close-all-windows-but-current'

# flip the whole machine between solarized light and dark
alt-t = 'exec-and-forget /Users/jeremy/.dotfiles/bin/theme toggle'

# ----------------------------------------------------------- service mode ----
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-h = ['join-with left', 'mode main']
alt-j = ['join-with down', 'mode main']
alt-k = ['join-with up', 'mode main']
alt-l = ['join-with right', 'mode main']

# ----------------------------------------------------- monitor placement -----
# Which physical screen each workspace opens on. Patterns are tried in order, so
# each group still resolves on the laptop alone, where no external matches.
#
# The two externals are both named "LG FHD" and macOS numbers them (1)/(2) in an
# order that can swap on replug, so the right-hand one is addressed by position.
[workspace-to-monitor-force-assignment]

# left external — Claude, and the terminals/agent sessions
A = ['lg fhd', 'built-in']
1 = ['lg fhd', 'built-in']
2 = ['lg fhd', 'built-in']
3 = ['lg fhd', 'built-in']
4 = ['lg fhd', 'built-in']
5 = ['lg fhd', 'built-in']
6 = ['lg fhd', 'built-in']
7 = ['lg fhd', 'built-in']
8 = ['lg fhd', 'built-in']
9 = ['lg fhd', 'built-in']

# right external — comms, browser, music. Index 3 is the rightmost of three.
S = [3, 'lg fhd', 'built-in']
M = [3, 'lg fhd', 'built-in']
B = [3, 'lg fhd', 'built-in']
U = [3, 'lg fhd', 'built-in']
W = [3, 'lg fhd', 'built-in']   # the dashboard when docked; with the laptop alone it joins Claude on A

# laptop — the editor and ChatGPT, on the sharpest screen
P = 'built-in'
G = 'built-in'

# ------------------------------------------------------ app placement --------
# Apps land where you expect them without being dragged there every morning.
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

# Every Chrome window lands on B. Mail is NOT matched by title here on purpose:
# a Workspace domain brands the title, and the big browser window often has a
# Gmail tab active, which would send it to M. `goto mail` creates its window and
# moves it to M itself, which is exact.
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.jetbrains.pycharm'
run = 'move-node-to-workspace P'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace A'

# ChatGPT ships as com.openai.codex; without this it lands on A beside Claude.
[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace G'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace U'

# The morning drill opens its own window; floating it keeps it from rearranging
# whatever you were already looking at.
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
if.window-title-regex-substring = 'drill'
run = 'layout floating'

# things that are the wrong shape for tiling
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

