# ~/.tmux.conf  ->  ~/.dotfiles/tmux/tmux.conf
#
# Descended from the 2013 config: C-a prefix and vi mode keys survived.
# Fixed along the way: the old file bound `k` twice, so "pane right" never worked.

# --- prefix -----------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix          # C-a a for a literal C-a (readline beginning-of-line)

# --- terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle"
set -as terminal-features ",*:RGB"
set -g default-command "${SHELL}"
set -sg escape-time 10        # 500ms default makes vim mode feel broken
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g display-time 2000
set -g status-interval 5
setw -g mode-keys vi
set -g detach-on-destroy off  # jump to another session instead of dropping to the shell

# --- panes and windows ------------------------------------------------------
# splits that keep the current directory, with keys that look like the split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi movement between panes (the old config meant to do this)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize, repeatable so you can hold the key
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r Space next-layout
bind z resize-pane -Z
bind Enter break-pane          # promote a pane to its own window

# --- copy mode --------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi / send -X search-forward
bind P paste-buffer

# --- sessions ---------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "reloaded"
bind S choose-tree -Zs
# fuzzy session switcher
bind C-j display-popup -E -w 60% -h 50% "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"
# popup shell over whatever you're doing
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind e display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

# --- agentic layout ---------------------------------------------------------
# C-a A: a window split for running an agent — big pane for claude, small for
# the shell you use to inspect what it did.
bind A split-window -h -l 35% -c "#{pane_current_path}" \; select-pane -L

# --- statusline -------------------------------------------------------------
# ANSI slots only, so solarized light and dark are both correct. Slot 0 is
# base02/base2 (the highlight background) and 11/12 are the body text colours.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour0,fg=colour11"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=colour4,bold] #S #[default]"
set -g status-right "#[fg=colour10]#{?client_prefix,#[fg=colour1]PREFIX ,}#[fg=colour10]#(whoami)@#h #[fg=colour12]%H:%M "
setw -g window-status-format "#[fg=colour10] #I #W "
setw -g window-status-current-format "#[fg=colour0,bg=colour4,bold] #I #W #[default]"
setw -g window-status-activity-style "fg=colour3,bold"
set -g pane-border-style "fg=colour0"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=colour3,fg=colour0,bold"
set -g mode-style "bg=colour4,fg=colour0"

# --- plugins ----------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# C-h/C-j/C-k/C-l with NO prefix move between panes, and across the boundary
# into nvim's splits. This is the one to build muscle memory on; prefix+hjkl
# below is the fallback. It costs you bare C-l for clearing the screen, so
# tmux-sensible's `prefix C-l` does that instead.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Long agent runs shouldn't die with a reboot.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
